name: Public Records Check

on:
  workflow_dispatch:

jobs:
  public-records:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate public records
        run: python3 scripts/generate_public_records.py --config public_records/config/scinetx.json

      - name: Compile generator
        run: python3 -m py_compile scripts/generate_public_records.py

      - name: Ensure committed generated files are up to date
        run: git diff --exit-code

name: Docs checks

on:
  workflow_dispatch:

jobs:
  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check markdown relative links
        run: python scripts/check_markdown_links.py

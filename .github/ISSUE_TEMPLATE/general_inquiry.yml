name: General inquiry
description: Ask a question about SciNetX capabilities, outputs, or licensing.
title: "[Question] "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Please avoid including sensitive data.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Suggested title format: `[Question] <short summary>`

        For access requests and support routing, see:
        - https://github.com/madavid128/SciNetX-Public/blob/main/REQUEST_ACCESS.md
        - https://github.com/madavid128/SciNetX-Public/blob/main/SUPPORT.md
  - type: input
    id: contact
    attributes:
      label: Contact email (optional)
      placeholder: name@domain.edu
    validations:
      required: false

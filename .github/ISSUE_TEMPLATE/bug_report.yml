name: Bug report (public)
description: Report a bug in distributed SciNetX artifacts (no source here).
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is the public landing repo and does not contain implementation code.
        If you are a licensed user with access to the private distribution, please prefer the licensed support channel.
  - type: input
    id: version
    attributes:
      label: Version/build identifier
      placeholder: e.g., 0.1.0, image digest, or portal release ID
    validations:
      required: true
  - type: dropdown
    id: artifact
    attributes:
      label: Artifact type
      options:
        - Desktop (macOS)
        - Desktop (Windows)
        - Docker
        - Colab
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include exact steps and what you expected vs what happened.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (redact sensitive data)
      description: Paste minimal logs or attach screenshots.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        For security issues, do not file a public issue. Email michael.david@cuanschutz.edu.

